name: Build NRO

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: pixeldash-nro
          path: pixeldash.nro
